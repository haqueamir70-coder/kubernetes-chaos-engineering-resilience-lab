# LAB ONLY. Restrict to one pod in the dedicated lab namespace.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: resilience-api-network-delay
  namespace: resilience-lab
  labels:
    app.kubernetes.io/part-of: resilience-lab
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - resilience-lab
    labelSelectors:
      app.kubernetes.io/name: resilience-api
  delay:
    latency: "100ms"
    correlation: "25"
    jitter: "10ms"
  duration: "30s"
  direction: to
