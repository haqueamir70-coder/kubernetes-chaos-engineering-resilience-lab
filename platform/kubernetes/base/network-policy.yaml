apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: resilience-api-default-deny
  namespace: resilience-lab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: resilience-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: resilience-lab
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
