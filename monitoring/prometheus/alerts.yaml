groups:
  - name: resilience-api
    rules:
      - alert: ResilienceApiUnavailable
        expr: up{job="resilience-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Resilience API scrape target is unavailable"
      - alert: ResilienceApiHigh5xxRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_requests_total[5m])), 1)
          > 0.001
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Resilience API 5xx ratio exceeds 0.1%"
